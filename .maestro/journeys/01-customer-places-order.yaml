    visible: "مش دلوقتي"
    timeout: 60000
- runFlow: _dismiss-prompts.yaml
- extendedWaitUntil:
    visible: "كل المحلات"
    timeout: 90000
- tapOn: "كل المحلات"
- extendedWaitUntil:
    visible: ".*متجر الاختبار.*"
    timeout: 90000
- tapOn: ".*متجر الاختبار.*"
- extendedWaitUntil:
    visible: ".*منتج تجريبي.*"
    timeout: 60000
- tapOn: "إضافة منتج تجريبي"
- extendedWaitUntil:
    visible: ".*عرض السلة.*"
    timeout: 30000
- tapOn: ".*عرض السلة.*"
- tapOn: "كمّل الطلب"
