name: city_store
description: "وصّلي - تطبيق توصيل الطعام والبقالة والورد."
publish_to: 'none'

version: 1.0.1+10

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_messaging: ^17.0.1
  firebase_app_check: ^0.5.1
  firebase_crashlytics: ^6.0.1
  firebase_performance: ^0.12.1
  cloud_functions: ^7.0.1

  google_sign_in: ^7.2.0

  geolocator: ^14.0.2
  geocoding: ^4.0.0
  package_info_plus: ^9.0.1
  in_app_update: ^4.2.3

  image_picker: ^1.1.2
  file_picker: ^10.3.8

  audioplayers: ^6.1.0
  record: ^6.1.2
  path_provider: ^2.1.5

  http: ^1.2.0
  url_launcher: ^6.3.3
  # مشاركة صورة إيصال الطلب (والروابط بعد كده) من غير أي قراءات.
  share_plus: '>=11.0.0 <13.0.0'
  # حفظ صورة الإيصال مباشرة في معرض الصور (أندرويد 10+ من غير صلاحيات).
  gal: ^2.3.0
  # كود QR لمحل صاحب المحل (بيترسم على الموبايل).
  qr_flutter: ^4.1.0

  shared_preferences: ^2.3.2

  # كاش صور القرص (للصور العامة فقط، بحدود: راجع lib/services/image_cache.dart)
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # أصوات التطبيق (جرس التنبيه). الملف متضمّن في المشروع: assets/sounds/bell.wav
  assets:
    - assets/sounds/
    - assets/images/

  # خط Tajawal متضمّن في التطبيق (بيتحمّل وقت البناء في GitHub Actions من مستودع Google Fonts الرسمي).
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
    # خط شاشة الدخول (IBM Plex Sans Arabic، رخصة OFL مرفقة في assets/fonts).
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

  
