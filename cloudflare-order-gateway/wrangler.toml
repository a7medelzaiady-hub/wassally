name = "throbbing-water-4ef7"
main = "src/index.ts"
compatibility_date = "2026-11-16"

# Persist Worker request/error logs across deployments for canary diagnostics.
[observability.logs]
enabled = true
invocation_logs = true

# Approximate per-user image upload protection; no Firestore counters/reads.
[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "122591726"

[ratelimits.simple]
limit = 10
period = 60

# Approximate per-user protection for order create/edit (before any Firestore read).
[[ratelimits]]
name = "ORDER_RATE_LIMITER"
namespace_id = "122591728"

[ratelimits.simple]
limit = 15
period = 60

[vars]
# Referral codes and registration only. Keep award settlement, payouts, point discounts
# and commission discounts disabled until the authenticated rollout is approved.
REFERRAL_REGISTRATION_ENABLED = "true"
REFERRAL_DELIVERY_ENABLED = "false"
DEFAULT_DELIVERY_FEE = "20"
MAX_ORDER_LINES = "100"
MAX_LINE_QTY = "50"
# الحد اليومي لطلبات العميل الواحد (بتوقيت القاهرة). ممكن يتغير من app_info/delivery_areas.maxOrdersPerDay.
MAX_ORDERS_PER_DAY = "50"
# رمز التسليم: سر اسمه DELIVERY_PIN_SECRET لازم يتضاف كـ secret (مش هنا):
#   npx wrangler secret put DELIVERY_PIN_SECRET   (قيمة عشوائية طويلة، ما تتغيرش بعد التشغيل)
CLOUDINARY_CLOUD_NAME = "g3n5pdfz"
# App Check: ابدأ بـ "monitor" وراقب السجلات، وبعد ما تتأكد إن نسخ التطبيق كلها بتبعت الرمز حوّلها "enforce".
APP_CHECK_MODE = "monitor"
FIREBASE_PROJECT_NUMBER = "244081237486"
# معرّف مشروع Firebase مش سر، فبيتكتب هنا. لازم يفضل هنا: `wrangler deploy` بيمسح أي
# متغير عادي (Plaintext) متسجّل من لوحة Cloudflare ومش موجود في الملف ده.
FIREBASE_PROJECT_ID = "wasally-12259"

# Configure secrets with: wrangler secret put FIREBASE_SERVICE_ACCOUNT_EMAIL
# FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY
# Set ALLOWED_ORIGINS as a comma-separated secret/variable for web clients.
# Signed image uploads also require: wrangler secret put CLOUDINARY_API_KEY
# wrangler secret put CLOUDINARY_API_SECRET (never commit either value).

[env.staging]
name = "throbbing-water-4ef7-staging"

[env.staging.vars]
CLOUDINARY_CLOUD_NAME = "g3n5pdfz"
# Wrangler لا يورّث متغيرات الجذر للبيئات: قبل تحويل staging لـ monitor/enforce
# أضف FIREBASE_PROJECT_NUMBER الخاص بمشروع الاختبار هنا (بدونه: monitor يتخطى، enforce يرفض 503).
APP_CHECK_MODE = "off"
DEFAULT_DELIVERY_FEE = "20"
MAX_ORDER_LINES = "100"
MAX_LINE_QTY = "50"
MAX_ORDERS_PER_DAY = "50"

[[env.staging.ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "122591727"

[env.staging.ratelimits.simple]
limit = 10
period = 60

[[env.staging.ratelimits]]
name = "ORDER_RATE_LIMITER"
namespace_id = "122591729"

[env.staging.ratelimits.simple]
limit = 15
period = 60
