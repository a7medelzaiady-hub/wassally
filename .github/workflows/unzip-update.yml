name: Unzip update

# تم تعطيل التشغيل التلقائي عند رفع zip (المرحلة 1): كان يستبدل المشروع كله بـ rsync --delete.
# يعمل يدويًا فقط من تبويب Actions ← Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip and replace project files
        run: |
          set -e
          zipfile=$(ls incoming/*.zip | head -n 1)
          mkdir /tmp/x
          unzip -q "$zipfile" -d /tmp/x
          src=/tmp/x
          # لو الزيب فيه مجلد واحد في الجذر (زي wasally-main) ندخل جواه
          if [ "$(ls -A /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls -A /tmp/x)" ]; then
            src="/tmp/x/$(ls -A /tmp/x)"
          fi
          rsync -a --delete \
            --exclude='.git/' --exclude='.github/' --exclude='incoming/' \
            "$src"/ ./
          rm -f incoming/*.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update project from zip" || echo "No changes"
          git push
