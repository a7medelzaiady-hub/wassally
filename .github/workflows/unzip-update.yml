name: Safe ZIP import

# ZIP-Import läuft ausschließlich manuell und wird als Pull Request geprüft.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and extract archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find incoming -maxdepth 1 -type f -name '*.zip' -print | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP file in incoming/, found ${#archives[@]}."
            exit 1
          fi

          archive="${archives[0]}"
          mkdir -p /tmp/wasally-import
          python3 - "${archive}" /tmp/wasally-import <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive, destination = sys.argv[1], pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as zf:
              members = zf.infolist()
              if not members:
                  raise SystemExit("Empty ZIP archives are not accepted.")

              for member in members:
                  name = member.filename
                  path = pathlib.PurePosixPath(name)
                  mode = member.external_attr >> 16
                  kind = stat.S_IFMT(mode)
                  if (not name or "\x00" in name or "\\" in name
                          or path.is_absolute()
                          or any(part in ("", ".", "..") for part in name.rstrip("/").split("/"))
                          or (len(name) >= 2 and name[1] == ":")):
                      raise SystemExit(f"Unsafe ZIP path rejected: {name!r}")
                  if kind not in (0, stat.S_IFREG, stat.S_IFDIR):
                      raise SystemExit(f"Special file or symbolic link rejected: {name!r}")
              zf.extractall(destination)
          PY

          entries=(/tmp/wasally-import/*)
          src=/tmp/wasally-import
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          fi

          # Never delete repository files or replace GitHub workflow settings.
          rsync -a \
            --exclude='.git/' --exclude='.github/' --exclude='incoming/' \
            "${src}/" ./
          rm -f "${archive}"

      - name: Create review branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="archive-import/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import reviewed project archive"
          git push --set-upstream origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "Review imported project archive" \
            --body "Automated ZIP import. Review the complete diff and CI results before merging; main was not modified directly."
