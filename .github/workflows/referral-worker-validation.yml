name: Referral Worker validation

on:
  push:
    branches:
      - feat/referrals-domain-isolated-20261123
    paths:
      - 'cloudflare-order-gateway/src/referral*.ts'
      - 'cloudflare-order-gateway/test/referral*.test.ts'
      - 'cloudflare-order-gateway/package*.json'
      - '.github/workflows/referral-worker-validation.yml'
  pull_request:
    paths:
      - 'cloudflare-order-gateway/src/referral*.ts'
      - 'cloudflare-order-gateway/test/referral*.test.ts'
      - 'cloudflare-order-gateway/package*.json'
      - '.github/workflows/referral-worker-validation.yml'
      - 'lib/screens/referral_campaign_page.dart'
      - 'lib/services/order_gateway.dart'
      - 'test/brand_and_referral_preview_test.dart'
      - '.github/workflows/flutter.yml'
      - '.github/workflows/release-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: referral-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  referral-worker:
    name: TypeScript and referral tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cloudflare-order-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (repository has no package-lock.json)
        run: npm install --no-package-lock
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Run referral unit tests
        run: npx vitest run test/referral*.test.ts
