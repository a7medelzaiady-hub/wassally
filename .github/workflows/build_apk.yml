name: Build Flutter Release APK

on:
  
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Download Tajawal font (bundled in app)
        run: |
          set -e
          mkdir -p assets/fonts
          for w in Regular Medium Bold ExtraBold Black; do
            curl -fsSL -o "assets/fonts/Tajawal-$w.ttf" \
              "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-$w.ttf"
          done
          ls -la assets/fonts

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          printf '%s\n' \
            "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" \
            "keyPassword=${{ secrets.KEY_PASSWORD }}" \
            "keyAlias=${{ secrets.KEY_ALIAS }}" \
            "storeFile=release.jks" > android/key.properties

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Build Release AAB (Google Play)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/*-release.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
