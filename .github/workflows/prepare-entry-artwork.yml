name: Prepare approved entry artwork

on:
  push:
    branches:
      - feat/compact-customer-entry-20261124
    paths:
      - scripts/split_entry_artwork.py
      - .github/workflows/prepare-entry-artwork.yml

permissions:
  contents: write

jobs:
  split-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/split_entry_artwork.py
      - name: Commit independent image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/entry/
          if ! git diff --cached --quiet; then
            git commit -m "assets(entry): extract five standalone artwork files"
            git push
          fi
