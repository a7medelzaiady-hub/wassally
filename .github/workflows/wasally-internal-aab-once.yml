name: Signed Google Play AAB - internal test build (one-time)

# Builds a signed AAB for Google Play INTERNAL TESTING only. Does NOT upload to Play,
# change Cloudflare/Firebase, or certify manual acceptance tests.
# This file is removed after its first verified successful build.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wasally-internal-aab-once.yml"

permissions:
  contents: read

concurrency:
  group: signed-google-play-internal-aab-once
  cancel-in-progress: false

jobs:
  release-aab:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Verify required signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Restore private upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          chmod 600 android/upload-keystore.jks android/key.properties
          keytool -list -keystore android/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null

      - name: Check trusted internal-test trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test -f .github/workflows/wasally-internal-aab-once.yml
          echo "Signing internal test app bundle; manual smoke tests remain required."

      - name: Verify production Worker health endpoint
        run: |
          curl --fail --silent --show-error https://throbbing-water-4ef7.a7medelzaiady.workers.dev/health | jq -e '.ok == true and .service == "wasally-order-gateway"'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Validate enabled referral entry points
        run: flutter test --dart-define=WASALLY_REFERRAL_REGISTRATION=true test/brand_and_referral_preview_test.dart

      - name: Build signed Play App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=WASALLY_ORDER_GATEWAY_URL=https://throbbing-water-4ef7.a7medelzaiady.workers.dev \
            --dart-define=WASALLY_SERVER_ORDERS=true \
            --dart-define=WASALLY_REFERRAL_REGISTRATION=true

      - name: Verify AAB exists and is a valid ZIP archive
        shell: bash
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify "$AAB" >/tmp/aab-signature-check.txt
          grep -qi 'jar verified' /tmp/aab-signature-check.txt
          echo "AAB archive and JAR signature verified."
          sha256sum "$AAB"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasally-google-play-internal-1.0.3-12-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material from runner
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/upload-keystore.jks
