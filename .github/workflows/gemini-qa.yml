name: Ask Gemini about Wasally code
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  answer:
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.login == 'a7medelzaiady-hub' && startsWith(github.event.issue.title, '[Gemini]')) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && github.event.comment.user.login == 'a7medelzaiady-hub' && startsWith(github.event.comment.body, '/gemini '))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ask Gemini using selected repository files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/gemini_qa.py
