# One-time deployment authorized by repository owner after notification fixes pass all CI.
# Triggers ONLY when this workflow is introduced/updated on main.
# Reuses existing secret validation, typecheck, unit tests, Wrangler deploy and health check.
name: Deploy approved notification Worker fixes (one-time)

# نشر Worker الإشعارات معتمد مرة واحدة عند دمج هذا الملف في main؛
# من main فقط بعد فحص واختبارات الـ Worker. أسرار الـ Worker نفسها (Firebase/Cloudinary)
# متخزنة على Cloudflare ومش بتتلمس هنا. الاستثناء الوحيد: DELIVERY_PIN_SECRET بيتعمل تلقائي
# مرة واحدة لو مش موجود (قيمة عشوائية مخفية)، ومش بيتغير بعد كده.
#
# محتاج سرّين في GitHub (Settings ← Secrets and variables ← Actions):
#   CLOUDFLARE_API_TOKEN   : توكن بصلاحية "Edit Cloudflare Workers" بس
#   CLOUDFLARE_ACCOUNT_ID  : رقم حساب Cloudflare

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wasally-approved-worker-deploy-once.yml"


permissions:
  contents: read

concurrency:
  group: deploy-order-gateway-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-order-gateway
    steps:
      - name: Confirm trusted main-branch release
        working-directory: .
        run: |
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test -f .github/workflows/wasally-approved-worker-deploy-once.yml
          echo "Executing approved single-use notification Worker deployment."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [[ -z "$CLOUDFLARE_API_TOKEN" ]] && missing+=(CLOUDFLARE_API_TOKEN)
          [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"; exit 1
          fi

      - name: Install dependencies
        run: |
          # npm ci لو فيه package-lock.json (تثبيت مطابق بالظبط)، وإلا npm install.
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run typecheck
      - run: npm test

      - name: Check required Worker secrets on Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # بنفحص الوجود بس من غير ما نطبع أسماء الأسرار في السجلات.
          # Capture Wrangler errors privately; never print raw output or secret values.
          err_file="$(mktemp)"
          trap 'rm -f "$err_file"' EXIT
          if ! list="$(npx wrangler secret list 2>"$err_file")"; then
            # Only emit numeric Cloudflare API error codes / HTTP status, never raw stderr.
            # Wrangler بيكتب الكود كده: [code: 10007]
            api_codes="$(grep -Eo '\[code: [0-9]+\]' "$err_file" | grep -Eo '[0-9]+' | sort -u | paste -sd ',' - || true)"
            http_status="$(grep -Eo 'HTTP (status )?(400|401|403|404|409|429|500|502|503)' "$err_file" | head -1 || true)"
            if [[ -n "$api_codes" ]]; then
              echo "::notice::Cloudflare API error code(s): $api_codes"
            fi
            if [[ -n "$http_status" ]]; then
              echo "::notice::Cloudflare $http_status"
            fi
            # عدد حروف رقم الحساب (لازم 32): بيكشف مسافة أو سطر زيادة من غير ما يطبعه.
            echo "::notice::Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
            # أول سطر خطأ من Wrangler بعد إخفاء أي رقم/توكن طويل وأي إيميل.
            first="$(grep -m1 -E 'ERROR|error' "$err_file" | cut -c1-200 \
              | sed -E 's/[A-Za-z0-9_-]{24,}/<hidden>/g; s/[^ ]+@[^ ]+/<email>/g' || true)"
            [[ -n "$first" ]] && echo "::notice::Wrangler error: $first"
            if grep -Eqi 'not logged in|authentication|unauthorized|invalid token|10000|10001' "$err_file"; then
              echo "::error::Cloudflare authentication failed. Verify API token validity and Workers permissions."
            elif grep -Eqi 'permission|forbidden|not authorized|9109' "$err_file"; then
              echo "::error::Cloudflare denied access. Verify token account scope and Workers permissions."
            elif grep -Eqi 'account|worker|script|configuration|wrangler' "$err_file"; then
              echo "::error::Wrangler could not access the configured Worker. Check account ID, Worker name and wrangler configuration."
            else
              echo "::error::Wrangler secret list failed. Inspect Cloudflare token/account configuration; raw error intentionally hidden."
            fi
            exit 1
          fi
          missing=()
          for name in FIREBASE_SERVICE_ACCOUNT_EMAIL FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            echo "$list" | grep -q "\"$name\"" || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Worker secrets missing on Cloudflare (${#missing[@]} of 4). Check them with: npx wrangler secret list"; exit 1
          fi
          # معرّف المشروع متغير عادي في wrangler.toml (مش سر)؛ لو مش موجود، النشر هيمسحه من الـ Worker.
          if ! grep -Eq '^FIREBASE_PROJECT_ID *= *"[a-z0-9-]+"' wrangler.toml && ! echo "$list" | grep -q '"FIREBASE_PROJECT_ID"'; then
            echo "::error::FIREBASE_PROJECT_ID must be set in wrangler.toml [vars] (or as a Worker secret)."; exit 1
          fi

      - name: Ensure DELIVERY_PIN_SECRET exists (created once, never printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # سر رمز التسليم: لو موجود على Cloudflare ما نلمسوش أبدًا (تغييره بيبوّظ رموز الطلبات اللي في الطريق).
          # لو مش موجود: نولّد قيمة عشوائية ونحطها مرة واحدة. القيمة مش بتتطبع ولا بتتخزن في GitHub.
          if npx wrangler secret list 2>/dev/null | grep -q '"DELIVERY_PIN_SECRET"'; then
            echo "DELIVERY_PIN_SECRET already set; leaving it unchanged."
          else
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s' "$value" | npx wrangler secret put DELIVERY_PIN_SECRET >/dev/null
            unset value
            npx wrangler secret list 2>/dev/null | grep -q '"DELIVERY_PIN_SECRET"' \
              || { echo "::error::Could not create DELIVERY_PIN_SECRET."; exit 1; }
            echo "DELIVERY_PIN_SECRET created."
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Health check
        working-directory: .
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error https://throbbing-water-4ef7.a7medelzaiady.workers.dev/health \
              | jq -e '.ok == true and .service == "wasally-order-gateway"'; then
              echo "Worker is healthy."; exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed. Roll back with: npx wrangler rollback"; exit 1
