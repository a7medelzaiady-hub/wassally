name: Maestro Android UI Smoke

on:
  # Run once for pull requests; run on push only after changes reach main.
  # Avoid duplicate emulator jobs for a feature-branch push plus its pull_request event.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: maestro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  login-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build debug APK for UI smoke test
        run: flutter build apk --debug --dart-define=WASALLY_SERVER_ORDERS=false

      - name: Install Maestro CLI
        run: |
          curl -Ls 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run login screen smoke flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install build/app/outputs/flutter-apk/app-debug.apk
            maestro test .maestro/flows/login-smoke.yaml
