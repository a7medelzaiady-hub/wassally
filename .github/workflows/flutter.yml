name: Flutter CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# تحديد متى يتم تشغيل السكريبت (عند عمل Push أو Pull Request على فرع main)
on:
  push:
    branches: [ "main", "codex/pr1-safe-integration-20261115" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      server_orders:
        description: Use the Worker order gateway in the test APK
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب كود المشروع من المستودع
    - uses: actions/checkout@v4

    # 2. تثبيت جافا (مطلوب لبناء تطبيقات أندرويد)
    - name: Set up Java
      if: github.event_name == 'workflow_dispatch'
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. تثبيت الـ Flutter SDK في بيئة الـ GitHub
    - name: Set up Flutter
      id: flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.50.0' # مثبت على إصدار Stable محدد لتكرارية البناء
        channel: 'stable'
        cache: true
        pub-cache: true

    # 4. تحميل المكتبات والمخازن (pub get)
    - name: Install dependencies
      env:
        FLUTTER_CACHE_HIT: ${{ steps.flutter.outputs.CACHE-HIT }}
        PUB_CACHE_HIT: ${{ steps.flutter.outputs.PUB-CACHE-HIT }}
      run: |
        echo "Flutter SDK cache hit: ${FLUTTER_CACHE_HIT:-false}"
        echo "Dart dependencies cache hit: ${PUB_CACHE_HIT:-false}"
        time flutter pub get

    # 5. عمل فحص وتأكد من سلامة الكود (اختياري)
    - name: Export resolved dependency lockfile
      uses: actions/upload-artifact@v4
      with:
        name: resolved-pubspec-lock
        path: pubspec.lock
        retention-days: 3

    - name: Analyze project source
      run: time flutter analyze --no-fatal-infos

    # 6. تشغيل الاختبارات الآلية
    - name: Run tests
      run: time flutter test

    # Exercise both the hidden-production default and enabled referral preview UI.
    - name: Validate referral preview (login, admin and brand)
      run: flutter test --dart-define=WASALLY_REFERRAL_REGISTRATION=true test/brand_and_referral_preview_test.dart

    # Compile-time canary only: verify the app recognizes the secure Worker order mode.
    - name: Test serverOrders-enabled gateway configuration
      run: flutter test --dart-define=WASALLY_SERVER_ORDERS=true test/services/order_gateway_test.dart

    # تفريغ مساحة من الأدوات غير المطلوبة قبل تنزيل NDK وبناء Android.
    - name: Free disk space before Android build
      if: github.event_name == 'workflow_dispatch'
      run: |
        sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
        sudo rm -rf /usr/local/lib/android/sdk/system-images
        sudo apt-get clean
        rm -rf build .dart_tool
        flutter pub get
        df -h /

    # تأكد أن مسار رفع الصور في Worker منشور فعلًا وليس endpoint قديمًا يعيد Unknown action.
    # ثبّت مفتاح Debug بين تشغيلات CI حتى لا تتغير بصمة Google OAuth مع كل APK.
    - name: Prepare Android debug keystore directory
      if: github.event_name == 'workflow_dispatch'
      run: mkdir -p "$HOME/.android"

    - name: Restore stable Android debug keystore
      if: github.event_name == 'workflow_dispatch'
      id: android-debug-key
      uses: actions/cache/restore@v5
      with:
        path: ~/.android/debug.keystore
        key: wasally-android-debug-keystore-v1

    - name: Generate stable Android debug keystore when absent
      if: github.event_name == 'workflow_dispatch' && steps.android-debug-key.outputs.cache-hit != 'true'
      run: |
        keytool -genkeypair -v \
          -keystore "$HOME/.android/debug.keystore" \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

    - name: Save stable Android debug keystore
      if: github.event_name == 'workflow_dispatch' && steps.android-debug-key.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.android/debug.keystore
        key: wasally-android-debug-keystore-v1

    # تسجيل الدخول عاد لمسار Firebase Provider القديم؛ لا يحتاج فحص SHA-1 داخل google-services.json.

    # نسخة الاختبار اليدوية تستخدم Firestore افتراضيًا، ويمكن اختيار وضع Worker عند التشغيل.
    - name: Build debug APK (retry transient dependency failures)
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        WASALLY_SERVER_ORDERS: ${{ inputs.server_orders }}
      run: |
        for attempt in 1 2 3; do
          echo "Android build attempt ${attempt}/3"
          if flutter build apk --debug \
            --dart-define=WASALLY_ORDER_GATEWAY_URL=https://throbbing-water-4ef7.a7medelzaiady.workers.dev \
            --dart-define=WASALLY_SERVER_ORDERS="$WASALLY_SERVER_ORDERS" \
            --dart-define=WASALLY_REFERRAL_REGISTRATION=true; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            sleep $((attempt * 20))
          fi
        done
        exit 1

    # اطبع بصمة شهادة APK الفعلية للتأكد من تطابق الملف الناتج.
    - name: Report debug APK signing certificate SHA-1
      if: github.event_name == 'workflow_dispatch'
      run: |
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
        test -n "$APKSIGNER"
        "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk

    # لازم بصمة التوقيع الفعلية للـ APK تكون مسجّلة في Firebase، وإلا دخول جوجل (الأصلي أو
    # عبر المتصفح) بيفشل. الفحص ده على الـ APK الناتج نفسه مش على الـ keystore بس.
    - name: Verify APK signing certificate is registered in Firebase config
      if: github.event_name == 'workflow_dispatch'
      run: |
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
        APK_SHA1="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk | sed -n 's/^.*certificate SHA-1 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
        echo "APK signing SHA-1: $APK_SHA1"
        python3 - "$APK_SHA1" <<'PY'
        import json, sys
        sha1 = sys.argv[1].lower()
        with open("android/app/google-services.json", encoding="utf-8") as f:
            config = json.load(f)
        registered = {
            oauth.get("android_info", {}).get("certificate_hash", "").lower()
            for client in config.get("client", [])
            if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.wassally.app"
            for oauth in client.get("oauth_client", [])
            if oauth.get("client_type") == 1
        }
        if sha1 not in registered:
            print("ERROR: the APK is signed with SHA-1 " + sha1 + " which is NOT registered for com.wassally.app.")
            print("Google sign-in will fail. Add this SHA-1 in Firebase Console (Project settings > Android app),")
            print("download the new google-services.json and commit it to android/app/.")
            raise SystemExit(1)
        print("OK: APK signing SHA-1 is registered in Firebase.")
        PY

    - name: Upload installable debug APK
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: wasally-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
        if-no-files-found: error
        retention-days: 7
