name: Deploy Order Gateway Worker (manual)

# نشر الـ Worker على Cloudflare من GitHub بدل جهازك. بيشتغل يدوي بس (Actions ← Run workflow)،
# من main بس، وبعد نجاح الفحص والاختبارات. أسرار الـ Worker نفسها (Firebase/Cloudinary)
# متخزنة على Cloudflare ومش بتتلمس هنا.
#
# محتاج سرّين في GitHub (Settings ← Secrets and variables ← Actions):
#   CLOUDFLARE_API_TOKEN   : توكن بصلاحية "Edit Cloudflare Workers" بس
#   CLOUDFLARE_ACCOUNT_ID  : رقم حساب Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "اكتب DEPLOY عشان تأكد نشر الـ Worker على الإنتاج"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-order-gateway-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-order-gateway
    steps:
      - name: Require confirmation and main branch
        working-directory: .
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$CONFIRM" != "DEPLOY" ]]; then
            echo "::error::اكتب DEPLOY في خانة التأكيد."; exit 1
          fi
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::النشر من main بس (الفرع الحالي: $REF)."; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [[ -z "$CLOUDFLARE_API_TOKEN" ]] && missing+=(CLOUDFLARE_API_TOKEN)
          [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if (( ${#missing[@]} )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"; exit 1
          fi

      - name: Install dependencies
        run: |
          # npm ci لو فيه package-lock.json (تثبيت مطابق بالظبط)، وإلا npm install.
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run typecheck
      - run: npm test

      - name: Check required Worker secrets on Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # بنفحص الوجود بس من غير ما نطبع أسماء الأسرار في السجلات.
          list="$(npx wrangler secret list 2>/dev/null)"
          missing=()
          for name in FIREBASE_PROJECT_ID FIREBASE_SERVICE_ACCOUNT_EMAIL FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            echo "$list" | grep -q "\"$name\"" || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Worker secrets missing on Cloudflare (${#missing[@]} of 5). Check them with: npx wrangler secret list"; exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Health check
        working-directory: .
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error https://throbbing-water-4ef7.a7medelzaiady.workers.dev/health \
              | jq -e '.ok == true and .service == "wasally-order-gateway"'; then
              echo "Worker is healthy."; exit 0
            fi
            sleep 5
          done
          echo "::error::Health check failed. Roll back with: npx wrangler rollback"; exit 1
