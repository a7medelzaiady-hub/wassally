name: Cloudflare Order Gateway CI

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-order-gateway/**"
      - ".github/workflows/order-gateway.yml"
  pull_request:
    paths:
      - "cloudflare-order-gateway/**"
      - ".github/workflows/order-gateway.yml"

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-order-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-order-gateway/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
