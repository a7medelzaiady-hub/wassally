name: Firestore Rules Tests

# اختبارات قواعد Firestore على Emulator (مفيش اتصال بمشروع الإنتاج، projectId تجريبي).
# مرحلة 1: الاختبارات الحالية + قياس حد قراءات القواعد. مفيش نشر ولا تعديل قواعد.
on:
  push:
    branches: [main]
    paths:
      - 'rules-tests/**'
      - 'firestore.rules'
      - '.github/workflows/rules_tests.yml'
  workflow_dispatch:

concurrency:
  group: rules-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install firebase-tools + test deps
        run: |
          npm install -g firebase-tools
          npm ci

      - name: Existing rules tests (rules.test.js)
        run: firebase emulators:exec --only firestore --project demo-wasally "node --test rules.test.js"

      - name: Reads-limit probe (measurement only, never edits rules)
        if: always()
        run: firebase emulators:exec --only firestore --project demo-wasally "node limit-probe.probe.js"

      - name: Compare rules versions (04e1e65 vs 6908ef0, measurement only)
        if: always()
        run: firebase emulators:exec --only firestore --project demo-wasally "node compare-versions.probe.js"

      - name: Expression-cost probe (measurement only)
        if: always()
        run: firebase emulators:exec --only firestore --project demo-wasally "node expression-cost.probe.js"

      - name: priceMap model - probe (capacity + attack tests, measurement only)
        if: always()
        run: firebase emulators:exec --only firestore --project demo-wasally "node pricemap.probe.js"

      - name: priceMap model - run the existing 32 tests against each model variant (temp rules files)
        if: always()
        run: |
          for v in C-slim-tier E-lean-size-tree F-lean-regex-tree G-origfixed-tree H-lean-regex-trim; do
            node build-model-rules.js "$v" "/tmp/model-$v.rules"
            echo "=== existing tests vs model $v ==="
            RULES_FILE="/tmp/model-$v.rules" firebase emulators:exec --only firestore --project demo-wasally "node --test rules.test.js" || echo "MODEL $v: SOME EXISTING TESTS FAILED"
          done

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: |
            rules-tests/probe-results.md
            rules-tests/compare-results.md
            rules-tests/expression-cost-results.md
            rules-tests/pricemap-results.md
          if-no-files-found: ignore
