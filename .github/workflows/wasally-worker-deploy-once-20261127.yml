name: Deploy Wasally Cloudflare Worker - authorized once 2026-11-27

# A one-time production deployment explicitly requested by the repository owner.
# Triggers only from the creation/update of THIS file on main with the exact
# commit message. The permanent manual deployment workflow remains unchanged.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wasally-worker-deploy-once-20261127.yml"

permissions:
  contents: read

concurrency:
  group: deploy-order-gateway-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.head_commit.message == 'deploy(worker): publish Wasally errands once 2026-11-27' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare-order-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Check authorized release target
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          grep -q 'approve-errand-quote' cloudflare-order-gateway/src/quick_orders.ts
          grep -q 'confirm-errand-pickup' cloudflare-order-gateway/src/quick_orders.ts
          echo 'Verified: main includes approved Wasally errands feature'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Missing Cloudflare deployment credentials in GitHub Actions'; exit 1
          fi
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate Wrangler bundle
        run: npx wrangler deploy --dry-run
      - name: Verify required secrets are already configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          list="$(npx wrangler secret list 2>/dev/null)" || { echo '::error::Unable to verify Cloudflare secrets'; exit 1; }
          for key in FIREBASE_SERVICE_ACCOUNT_EMAIL FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY CLOUDINARY_API_KEY CLOUDINARY_API_SECRET DELIVERY_PIN_SECRET; do
            if ! grep -q "\"$key\"" <<< "$list"; then
              echo "::error::A required Cloudflare Worker secret is not configured: $key"
              exit 1
            fi
          done
      - name: Deploy Cloudflare Worker to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify production health endpoint
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error https://throbbing-water-4ef7.a7medelzaiady.workers.dev/health | jq -e '.ok == true and .service == "wasally-order-gateway"'; then
              echo 'Production Cloudflare Worker health check passed'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Production Worker health check failed'
          exit 1
