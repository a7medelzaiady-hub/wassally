name: Gemini integration unit tests
on:
  pull_request:
    paths:
      - '.github/scripts/gemini_qa.py'
      - '.github/tests/test_gemini_qa.py'
      - '.github/workflows/gemini-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run mocked Gemini tests (no API key required)
        run: python3 -m unittest discover -s .github/tests -p 'test_gemini_qa.py' -v
