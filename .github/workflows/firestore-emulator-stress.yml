name: Firestore Emulator Stress Tests

on:
  push:
    branches:
      - main
      - codex/pr1-safe-integration-20261115
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'rules-tests/**'
      - 'cloudflare-order-gateway/**'
      - 'firestore-debug.log'
      - '.github/workflows/firestore-emulator-stress.yml'
      - '.github/workflows/firestore-rules.yml'
      - 'ORDER_LIFECYCLE_AUDIT_AR.md'
  pull_request:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'rules-tests/**'
      - '.github/workflows/firestore-emulator-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-emulator-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated test dependencies
        working-directory: rules-tests
        run: npm install --no-audit --no-fund

      - name: Run Firestore rules and concurrency stress tests
        working-directory: rules-tests
        env:
          WASALLY_STRESS_MAX_CLIENTS: '500'
        run: npm test
